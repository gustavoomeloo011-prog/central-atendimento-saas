services:
  - type: web
    name: central-atendimento-demo
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --dir apps/connector install --no-frozen-lockfile
    startCommand: pnpm dev:pg
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: /tmp/central-atendimento-demo.db
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_COMPANY_ID
        sync: false
      - key: WHATSAPP_CONNECTOR_URL
        sync: false
      - key: WHATSAPP_CONNECTOR_TOKEN
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WABA_ID
        sync: false
